[project]
name = "recetas-ia"
version = "1.1.0"
description = "Recetas de IA en espanol: 15 scripts practicos y comentados sobre NVIDIA NIM (o cualquier API compatible con OpenAI)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alejandro Brito" }]
requires-python = ">=3.9"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0.0"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
